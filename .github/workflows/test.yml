name: Build and run tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # Behavior:
  # - Group all pull requests: latest push cancels previous ones
  # - Group all branches: run serially
  group: >
    test-${{
      (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('branch-{0}', github.ref_name)) ||
      ''
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    uses: Silimate/actions/.github/workflows/cpp-cmake-ci.yml@v1
    with:
      # No dependency install: the runners already have Ninja and CMake, and
      # slang's CMakeLists fetches the rest.
      runners: >-
        [{"name":"Ubuntu 24.04","family":"linux","runner":"ubuntu-24.04","arch":"x86_64"},
         {"name":"macOS 15","family":"macos","runner":"macos-15","arch":"arm64"}]
      cmake-generator: Ninja
